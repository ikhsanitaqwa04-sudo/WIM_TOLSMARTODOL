<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Ilustrasi gerbang pemeriksaan WIM TOLSMART-ODOL</title><desc id="d">Truk melewati sensor timbang dinamis, kamera ANPR dan sensor dimensi pada gerbang pemeriksaan jalan tol.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0b1d39"/><stop offset="1" stop-color="#142e51"/></linearGradient><linearGradient id="truck" x2="0" y2="1"><stop stop-color="#e8c64d"/><stop offset="1" stop-color="#a77a20"/></linearGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#34445a"/><stop offset="1" stop-color="#1c293b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
